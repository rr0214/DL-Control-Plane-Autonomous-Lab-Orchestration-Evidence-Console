[project]
name = "sdl-control-plane"
version = "0.5.0"
description = "SDL Control Plane: Autonomous Lab Orchestration & Evidence Console (backend)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "pydantic>=2.7",
  "langgraph>=0.2.60",
  "langgraph-checkpoint-sqlite>=2.0.0",
  "anthropic>=0.40",
  "python-dotenv>=1.0",
  "httpx>=0.27",
  "mcp>=1.2",
  # Observability: live traces into Arize Phoenix
  "arize-phoenix>=8",
  "arize-phoenix-otel>=0.9",
  "openinference-instrumentation-langchain>=0.1",
  "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
