# Render Blueprint for the SDL Control Plane demo. Three web services, all on the Starter plan.
#
# Public URLs (Render derives them from the service names; see DEPLOY.md if one is taken):
#   console  https://sdl-console-rr.onrender.com
#   API      https://sdl-api-rr.onrender.com
#   Phoenix  https://sdl-phoenix-rr.onrender.com
#
# Secrets are never stored here. ANTHROPIC_API_KEY, SDL_ACCESS_PASSWORD, PHOENIX_API_KEY, PHOENIX_SECRET and
# PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD use sync: false: their values are set in the Render dashboard.

services:
  # Backend: FastAPI, LangGraph and SQLite. Data and workflow checkpoints live on the persistent disk.
  - type: web
    name: sdl-api-rr
    runtime: python
    plan: starter
    region: oregon
    buildCommand: pip install -r backend/requirements.txt
    startCommand: cd backend && uvicorn app.api:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    disk:
      name: sdl-data
      mountPath: /var/data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.11"
      - key: SDL_DB_PATH
        value: /var/data/sdl.db
      - key: SDL_CHECKPOINT_PATH
        value: /var/data/checkpoints.sqlite
      - key: SDL_TRACING
        value: "on"
      - key: PHOENIX_COLLECTOR_ENDPOINT
        value: https://sdl-phoenix-rr.onrender.com
      - key: PHOENIX_PUBLIC_URL
        value: https://sdl-phoenix-rr.onrender.com
      - key: SDL_ALLOWED_ORIGINS
        value: https://sdl-console-rr.onrender.com
      # Most plan runs per UTC day (each can call Claude, about $0.01 to $0.02). 0 means no limit.
      - key: SDL_DAILY_RUN_LIMIT
        value: "25"
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: SDL_ACCESS_PASSWORD
        sync: false
      # A system API key created in Phoenix (Settings, API keys) after its login is on. The API sends traces with it;
      # without it the login-protected Phoenix rejects them (the app keeps working). Set in the dashboard.
      - key: PHOENIX_API_KEY
        sync: false

  # Frontend: the Next.js console. NEXT_PUBLIC_API_URL is baked in at build time.
  - type: web
    name: sdl-console-rr
    runtime: node
    plan: starter
    region: oregon
    rootDir: frontend
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NEXT_PUBLIC_API_URL
        value: https://sdl-api-rr.onrender.com
      # The header's Phoenix traces link (baked in at build time): the full address of the sdl-control-plane project
      # page in the hosted Phoenix, https://sdl-phoenix-rr.onrender.com/projects/<project id>. The ID only exists once
      # Phoenix is live and has received a trace, so this starts empty (the link then goes to the Architecture page's
      # Traces section). See DEPLOY.md.
      - key: NEXT_PUBLIC_PHOENIX_URL
        value: ""

  # Phoenix: the trace viewer and OTLP collector, from the prebuilt image (Render's runtime for a public
  # Docker image is "image"). Traces are kept on the persistent disk.
  - type: web
    name: sdl-phoenix-rr
    runtime: image
    plan: starter
    region: oregon
    image:
      url: docker.io/arizephoenix/phoenix:version-21.0.0
    disk:
      name: phoenix-data
      mountPath: /mnt/phoenix
      sizeGB: 1
    envVars:
      - key: PORT
        value: "6006"
      - key: PHOENIX_PORT
        value: "6006"
      - key: PHOENIX_HOST
        value: 0.0.0.0
      - key: PHOENIX_WORKING_DIR
        value: /mnt/phoenix
      # Login. Phoenix 21 already requires it on a public host such as 0.0.0.0; this makes it explicit.
      - key: PHOENIX_ENABLE_AUTH
        value: "true"
      - key: PHOENIX_USE_SECURE_COOKIES
        value: "true"
      # Secrets, set in the dashboard. PHOENIX_SECRET: at least 32 characters with a digit and a lowercase letter.
      # PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD: replaces the default admin password "admin" while it is unchanged.
      - key: PHOENIX_SECRET
        sync: false
      - key: PHOENIX_DEFAULT_ADMIN_INITIAL_PASSWORD
        sync: false
